# Pytest Configuration for CBC Registration Functional Test Suite
# Updated by Claude AI on 2026-09-08

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for functional test categorization
markers =
    critical: Critical functionality tests (registration workflows, admin dashboard, CSV export)
    admin: Admin interface and management tests
    registration: Participant registration workflow tests
    csv: CSV export functionality tests
    auth: Authentication and authorization tests
    workflow: End-to-end workflow tests
    security: Security validation tests
    performance: Performance and load tests
    slow: Slow-running tests
    family: Family email sharing scenario tests
    browser: Browser-based integration tests (Selenium)
    api: Direct API tests (requests library)
    installation: Installation validation tests (portable, configuration-driven)
    smoke: Quick smoke tests for basic validation (subset of comprehensive tests)
    regression: Regression tests for previously fixed bugs
    identity: Identity-based and family email tests

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warning configuration
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test execution options. Inline comments are deliberately NOT used on these
# lines - pytest includes any trailing # comment as literal text in a
# multi-line ini value, which silently corrupted every option below (verified
# 2026-09-08: markers/addopts had zero effect despite being "configured").
addopts =
    --strict-markers
    --tb=short
    --html=reports/test_report.html
    --self-contained-html
